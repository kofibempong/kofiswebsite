<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Private</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF7;--text:#1A1A18;--sec:#5C5C57;--accent:#2C5F4B;--border:#E5E5E0}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:2.75rem;
  width:100%;max-width:360px;margin:2rem}
.icon{font-size:1.8rem;margin-bottom:1.4rem}
h1{font-family:'DM Serif Display',Georgia,serif;font-size:1.55rem;font-weight:400;margin-bottom:.45rem}
.desc{font-size:.83rem;color:var(--sec);margin-bottom:2rem;line-height:1.55}
label{display:block;font-size:.72rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  color:#8A8A84;margin-bottom:.45rem}
input[type=password]{width:100%;padding:.7rem 1rem;border:1px solid var(--border);border-radius:6px;
  font-size:1rem;background:var(--bg);color:var(--text);margin-bottom:1rem;font-family:inherit}
input[type=password]:focus{outline:none;border-color:var(--accent)}
button{width:100%;padding:.72rem;background:var(--accent);color:#fff;border:none;border-radius:6px;
  font-family:inherit;font-size:.9rem;font-weight:500;cursor:pointer;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.6rem}
button:hover{background:#245040}
button:disabled{opacity:.65;cursor:not-allowed}
.spin{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,.35);
  border-top:2px solid #fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{font-size:.8rem;color:#C84B31;margin-top:.7rem;display:none}
.err.show{display:block}
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#128274;</div>
  <h1>Private Document</h1>
  <p class="desc">Enter the password to continue. Decryption happens entirely in your browser — nothing is sent to a server.</p>
  <form onsubmit="return false">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus placeholder="Enter password">
    <button id="btn" onclick="go()"><span id="btxt">Unlock</span><div class="spin" id="spin"></div></button>
    <p class="err" id="err">Incorrect password — please try again.</p>
  </form>
</div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function go(){
  const pw=document.getElementById('pw').value; if(!pw)return;
  const btn=document.getElementById('btn'),btxt=document.getElementById('btxt'),
        spin=document.getElementById('spin'),err=document.getElementById('err');
  btn.disabled=true; btxt.style.display='none'; spin.style.display='block'; err.classList.remove('show');
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(SALT),iterations:600000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CT));
    const html=new TextDecoder().decode(plain);
    document.open('text/html'); document.write(html); document.close();
  }catch(e){
    btn.disabled=false; btxt.style.display=''; spin.style.display='none'; err.classList.add('show');
  }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
</script>
